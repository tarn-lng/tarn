name: Release Linux toolchain
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vX.Y.Z)
        required: true
permissions:
  contents: read
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - id: version
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - name: Report existing formatting debt
        continue-on-error: true
        run: cargo fmt --all -- --check > formatting.log 2>&1
      - run: cargo test --locked --release --workspace
        env:
          # Keep Cranelift's IR verifier on for the whole test suite.
          TARN_VERIFY_CODEGEN: '1'
      - run: cargo build --locked --release -p tarn -p tarn-lsp
      - run: python3 tools/release/test-container-policy.py
      - run: python3 tools/release/test-platform.py
      - run: tools/release/test-install.sh
      - run: tools/release/package.sh "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-toolchain-${{ matrix.arch }}
          path: |
            target/dist/*.tar.gz
            target/dist/SHA256SUMS
            tools/release/install.sh
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-toolchain-*
          path: artifacts
      - name: Publish immutable prerelease assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists; refusing asset replacement' >&2
            exit 1
          fi
          mkdir -p dist
          cp artifacts/linux-toolchain-*/target/dist/*.tar.gz dist/
          cat artifacts/linux-toolchain-*/target/dist/SHA256SUMS | LC_ALL=C sort -k2 > dist/SHA256SUMS
          cmp artifacts/linux-toolchain-x86_64/tools/release/install.sh artifacts/linux-toolchain-aarch64/tools/release/install.sh
          cp artifacts/linux-toolchain-x86_64/tools/release/install.sh dist/install.sh
          (cd dist; sha256sum --check --strict SHA256SUMS)
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --generate-notes \
            --title "Tarn $TAG — experimental Linux x86_64 / ARM64" \
            dist/*.tar.gz dist/SHA256SUMS dist/install.sh
  container:
    needs: [build, publish]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/container.yml
    with:
      tag: ${{ needs.build.outputs.tag }}
