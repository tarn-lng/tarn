name: Compiler CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  msrv:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.88
      - run: cargo build --locked --release -p tarn
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Report existing formatting debt
        continue-on-error: true
        run: cargo fmt --all -- --check > formatting.log 2>&1
      - run: cargo test --locked --release --workspace
        env:
          # Keep Cranelift's IR verifier on for the whole test suite.
          TARN_VERIFY_CODEGEN: '1'
      - run: cargo build --locked --release -p tarn -p tarn-lsp
      - name: Examples smoke (tarn check)
        run: |
          for example in examples/*.tarn; do
            echo "::group::tarn check $example"
            target/release/tarn check "$example"
            echo "::endgroup::"
          done
      - name: Examples output (tarn run)
        run: tools/ci/run-examples.sh target/release/tarn
      - name: Native application smoke
        run: |
          target/release/tarn build examples/csv_report/main.tarn -o /tmp/tarn-csv-report
          target/release/tarn init /tmp/tarn-smoke
          cd /tmp/tarn-smoke
          "$GITHUB_WORKSPACE/target/release/tarn" run
      - run: python3 tools/release/test-container-policy.py
      - run: python3 tools/release/test-platform.py
      - run: tools/release/test-install.sh
      - name: Native builder image smoke
        run: |
          VERSION=$(target/release/tarn version | cut -d ' ' -f 2)
          ARCH=$(sh tools/release/platform.sh)
          python3 tools/release/container.py prepare "v$VERSION" target/dist target/container-context "$ARCH"
          docker build --build-arg "VERSION=$VERSION" --build-arg "REVISION=$GITHUB_SHA" --tag tarn-ci-builder target/container-context
          python3 tools/release/test-container.py tarn-ci-builder "$VERSION"
